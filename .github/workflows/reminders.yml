name: Deliver Telegram reminders
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: telegram-reminders
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check due reminders
        env:
          PUBLIC_ORIGIN: https://sechenovka-tracker.onrender.com
          CRON_SECRET: ${{ secrets.REMINDER_CRON_SECRET }}
        run: node scripts/run-reminders.mjs
