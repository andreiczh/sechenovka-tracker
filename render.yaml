services:
  - type: web
    name: sechenovka-tracker
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm ci --ignore-scripts && npm test
    startCommand: node server.mjs
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: REMINDER_SCHEDULER
        value: external
      - key: CRON_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: TELEGRAM_IDENTITY_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_USERNAME
        value: sechenov_track_bot
